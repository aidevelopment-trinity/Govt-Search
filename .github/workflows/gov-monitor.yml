name: Gov Contract Monitor

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "50 13 * * *"
  workflow_dispatch:

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run due monitor searches
        env:
          APP_URL: ${{ vars.GOV_CONTRACT_FINDER_URL || 'https://govt-search-web.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BACKUP_SECRET: ${{ secrets.CRON_BACKUP_SECRET }}
        run: |
          AUTH_SECRET="${CRON_BACKUP_SECRET:-$CRON_SECRET}"

          if [ -z "$AUTH_SECRET" ]; then
            echo "::error::Missing repository secret CRON_BACKUP_SECRET or CRON_SECRET; monitor run cannot authenticate."
            exit 1
          fi

          curl --fail --show-error --silent --max-time 70 --retry 2 \
            -H "Authorization: Bearer $AUTH_SECRET" \
            "$APP_URL/api/cron/gov-monitor?maxRuns=3"

  email-digest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send due email digests
        env:
          APP_URL: ${{ vars.GOV_CONTRACT_FINDER_URL || 'https://govt-search-web.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BACKUP_SECRET: ${{ secrets.CRON_BACKUP_SECRET }}
        run: |
          AUTH_SECRET="${CRON_BACKUP_SECRET:-$CRON_SECRET}"

          if [ -z "$AUTH_SECRET" ]; then
            echo "::error::Missing repository secret CRON_BACKUP_SECRET or CRON_SECRET; email digest cannot authenticate."
            exit 1
          fi

          curl --fail --show-error --silent --max-time 70 --retry 2 \
            -H "Authorization: Bearer $AUTH_SECRET" \
            "$APP_URL/api/cron/email-digest"
